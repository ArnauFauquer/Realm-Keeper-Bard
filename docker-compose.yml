services:
  app:
    build: .
    image: realmkeeper-bard
    ports:
      - "127.0.0.1:8765:8765"
    env_file: .env
    volumes:
      # everything that is not code: generated images, uploads, references,
      # style profile, GGUF weights (models/) and Hugging Face / rembg caches
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
