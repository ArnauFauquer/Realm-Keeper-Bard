services:
  app:
    build: .
    image: realmkeeper-bard
    ports:
      - "127.0.0.1:8765:8765"
    env_file: .env
    volumes:
      # todo lo que no es código: imágenes generadas, subidas, referencias,
      # perfil de estilo, pesos GGUF (models/) y cachés de Hugging Face / rembg
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
